name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-host-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-host-code.sh

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: |
          make SDK=iphoneos
          make SDK=iphonesimulator
